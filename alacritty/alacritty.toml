[env]
term = "xterm-256color"

[cursor]
# style = "Beam"
blink_interval = 75
blink_timeout = 0

[font]
size = 10
normal = {family = "Hack", style = "normal"}

[window.padding]
x = 10
y = 10

[window]

dynamic_title = true
dynamic_padding = true
blur = true
opacity = 1

[mouse]

hide_when_typing = true

[keyboard]
bindings = [
  # Paste from clipboard
  { key = "P", mods = "Control|Shift", action = "Paste" },

  # Copy to clipboard
  { key = "Y", mods = "Control|Shift", action = "Copy" },

  # (Optional) Remove your old binding so <C-p> stays free
  # { key = "P", mods = "Control", action = "PasteSelection" },
]

[terminal]

[terminal.shell]
program = "/usr/bin/fish"
args = ["-l"]

[colors.primary]
background = "#24283b"
foreground = "#dcdfe1"

[colors.cursor]
text = "#24283b"
cursor = "#B9A88C"

[colors.selection]
text = "#24283b"
background = "#7aa2f7"

[colors.normal]
black   = "#1a1b26"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[colors.bright]
black   = "#414868"
red     = "#ff899d"
green   = "#b9f27c"
yellow  = "#f5c06f"
blue    = "#89b4fa"
magenta = "#c6a0f6"
cyan    = "#89ddff"
white   = "#ffffff"

[colors.search.matches]
foreground = "#24283b"
background = "#B9A88C"

[colors.search.focused_match]
foreground = "#24283b"
background = "#7aa2f7"

[colors.hints.start]
foreground = "#24283b"
background = "#e0af68"

[colors.hints.end]
foreground = "#dcdfe1"
background = "#414868"

[colors.footer_bar]
foreground = "#dcdfe1"
background = "#1f2335"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.vi_mode_cursor]
text = "#24283b"
cursor = "#bb9af7"
